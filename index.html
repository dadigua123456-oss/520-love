<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>520 小惊喜</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      position: relative;
    }

    .heart {
      position: absolute;
      color: rgba(255,255,255,0.7);
      animation: float 8s linear infinite;
      font-size: 20px;
    }

    @keyframes float {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        transform: translateY(-120px) scale(1.4);
        opacity: 0;
      }
    }

    .card {
      width: 88%;
      max-width: 420px;
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 38px 28px;
      text-align: center;
      color: white;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .title {
      font-size: 34px;
      margin-bottom: 18px;
      font-weight: bold;
    }

    .text {
      font-size: 18px;
      line-height: 1.9;
      margin-bottom: 28px;
    }

    .btn {
      border: none;
      background: white;
      color: #ff5c8a;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 17px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: bold;
    }

    .btn:hover {
      transform: scale(1.06);
    }

    .hidden {
      margin-top: 26px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.8s ease;
      font-size: 20px;
      line-height: 1.8;
    }

    .show {
      opacity: 1;
      transform: translateY(0);
    }

    .signature {
      margin-top: 20px;
      font-size: 16px;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">520 ❤️</div>
    <div class="text">
      今天的风很温柔，<br>
      阳光也刚刚好。<br><br>
      但这些都不如——<br>
      你出现在我的生活里。
    </div>

    <button class="btn" onclick="showLove()">点我一下</button>

    <div id="love" class="hidden">
      我喜欢你，不止今天。<br>
      是认真、坚定、想陪你很久的那种喜欢。<br><br>
      以后每一个520，<br>
      我都想和你一起过。 💖

      <div class="signature">
        —— 来自一直偷偷喜欢你的人
      </div>
    </div>
  </div>

  <script>
    function showLove() {
      document.getElementById('love').classList.add('show');
    }

    function createHeart() {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerHTML = '❤';
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.animationDuration = (Math.random() * 4 + 5) + 's';
      heart.style.fontSize = (Math.random() * 20 + 16) + 'px';
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 9000);
    }

    setInterval(createHeart, 300);
  </script>
</body>
</html>
